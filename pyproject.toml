[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["finflow*"]

[project]
name = "finflow"
version = "0.1.0"
description = "Financial Data ETL & Reconciliation Platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}

dependencies = [
    "fastapi>=0.110.0,<1.0",
    "uvicorn[standard]>=0.29.0,<1.0",
    "sqlalchemy>=2.0.25,<3.0",
    "alembic>=1.13.0,<2.0",
    "psycopg[binary]>=3.1.0,<4.0",
    "pandas>=2.2.0,<3.0",
    "pydantic>=2.6.0,<3.0",
    "pydantic-settings>=2.1.0,<3.0",
    "python-dotenv>=1.0.0,<2.0",
    "python-multipart>=0.0.7,<1.0",
    "streamlit>=1.31.0,<2.0",
    "plotly>=5.18.0,<6.0",
    "structlog>=24.1.0,<25.0",
    "httpx>=0.27.0,<1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9.0",
    "pytest-asyncio>=0.23.0,<1.0",
    "pytest-cov>=4.1.0,<6.0",
    "ruff>=0.3.0,<1.0",
    "aiosqlite>=0.20.0,<1.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501", "B008", "E402", "N806"]

[tool.ruff.lint.isort]
known-first-party = ["finflow"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests requiring PostgreSQL",
    "e2e: marks end-to-end tests",
]
addopts = "-v --tb=short"
